<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: Gotham night sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>

    <!-- Bat symbol glow -->
    <radialGradient id="batGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DB8FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4DB8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4DB8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Sonar pulse gradient -->
    <radialGradient id="sonarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DB8FF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#4DB8FF" stop-opacity="0"/>
      <stop offset="95%" stop-color="#4DB8FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4DB8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Extruded 3D bevel for bat symbol -->
    <linearGradient id="batBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="50%" stop-color="#8a6a24"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Neon flicker filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Fog gradient -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DB8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4DB8FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4DB8FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Skyline building gradient -->
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#skyGrad)"/>

  <!-- Drifting fog layers -->
  <rect x="-200" y="40" width="1300" height="60" fill="url(#fogGrad)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 150 0; 0 0" dur="18s" repeatCount="indefinite"/>
  </rect>
  <rect x="-300" y="120" width="1300" height="40" fill="url(#fogGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -180 0; 0 0" dur="22s" repeatCount="indefinite"/>
  </rect>

  <!-- Sonar scanning pulse -->
  <circle cx="450" cy="150" r="10" fill="url(#sonarGrad)">
    <animate attributeName="r" values="10;280" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="150" r="10" fill="url(#sonarGrad)">
    <animate attributeName="r" values="10;280" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Gotham skyline (deep perspective) -->
  <g opacity="0.9">
    <rect x="0" y="210" width="60" height="90" fill="url(#buildingGrad)"/>
    <rect x="55" y="180" width="45" height="120" fill="url(#buildingGrad)"/>
    <rect x="95" y="230" width="35" height="70" fill="url(#buildingGrad)"/>
    <rect x="760" y="200" width="50" height="100" fill="url(#buildingGrad)"/>
    <rect x="805" y="170" width="40" height="130" fill="url(#buildingGrad)"/>
    <rect x="840" y="220" width="60" height="80" fill="url(#buildingGrad)"/>
    <!-- Gothic spire (Wayne Tower style) -->
    <polygon points="775,170 785,120 795,170" fill="url(#buildingGrad)"/>
    <rect x="130" y="245" width="30" height="55" fill="url(#buildingGrad)"/>
    <!-- window glimmers -->
    <rect x="10" y="230" width="3" height="3" fill="#E5A93C" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="815" y="200" width="3" height="3" fill="#4DB8FF" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Ground fade -->
  <rect x="0" y="295" width="900" height="5" fill="#000000"/>

  <!-- Extruded / glowing Bat Symbol (Sonar signal centerpiece) -->
  <g transform="translate(450,150)" filter="url(#glow)">
    <circle r="95" fill="url(#batGlow)">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="scale(1.55) translate(-24,-14)" fill="url(#batBevel)" stroke="#4DB8FF" stroke-width="0.4">
      <path d="M24 2
               C 22 6, 19 8, 15 8
               C 17 4, 13 2, 8 5
               C 10 1, 4 -1, 0 4
               C -2 -2, -8 -3, -13 1
               C -10 -3, -13 -7, -18 -6
               C -13 -9, -8 -9, -6 -6
               C -6 -10, -3 -13, 1 -13
               C -1 -10, 0 -7, 2 -7
               C 4 -10, 8 -12, 12 -11
               C 9 -8, 9 -5, 11 -4
               C 14 -8, 19 -9, 22 -6
               C 18 -6, 15 -4, 15 -1
               C 19 -2, 22 0, 24 2 Z"/>
    </g>
  </g>

  <!-- Flickering neon accent line -->
  <line x1="150" y1="255" x2="750" y2="255" stroke="#4DB8FF" stroke-width="1.2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.6;0.5" dur="2.2s" repeatCount="indefinite"/>
  </line>

  <!-- Name, styled like a classified terminal readout -->
  <text x="450" y="245" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="34" font-weight="bold" fill="#F5F5F5" letter-spacing="6" filter="url(#softGlow)">
    OJESH DWIVEDI
  </text>
  <text x="450" y="245" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="34" font-weight="bold" fill="#FFFFFF" letter-spacing="6">
    OJESH DWIVEDI
  </text>

  <text x="450" y="270" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#E5A93C" letter-spacing="4" opacity="0.85">
    WAYNE ENTERPRISES // APPLIED SCIENCES DIVISION
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- corner tactical brackets -->
  <g stroke="#4DB8FF" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M15 15 L15 40 M15 15 L40 15"/>
    <path d="M885 15 L885 40 M885 15 L860 15"/>
    <path d="M15 285 L15 260 M15 285 L40 285"/>
    <path d="M885 285 L885 260 M885 285 L860 285"/>
  </g>
</svg>
